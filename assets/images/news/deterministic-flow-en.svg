<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210" role="img" aria-label="The model decides, the script executes, the plan is reviewed before anything is written">
<title>The model decides, the script executes, the plan is reviewed before anything is written</title>
<rect x="1" y="1" width="898" height="208" rx="16" fill="#f6efe0" stroke="#d9cdb4" stroke-width="2"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b4532a"/></marker></defs>
<rect x="24" y="60" width="190" height="100" rx="12" fill="#fffaf0" stroke="#d9cdb4" stroke-width="1.5"/><text x="119" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#111524" text-anchor="middle">Model</text><text x="119" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#111524" text-anchor="middle">understands, chooses</text><text x="119" y="142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#111524" text-anchor="middle">and explains</text><line x1="216" y1="110" x2="242" y2="110" stroke="#b4532a" stroke-width="2.5" marker-end="url(#a)"/><rect x="246" y="60" width="190" height="100" rx="12" fill="#e8c77a" stroke="#d9cdb4" stroke-width="1.5"/><text x="341" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#111524" text-anchor="middle">Script</text><text x="341" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#111524" text-anchor="middle">runs the exact steps</text><text x="341" y="142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#111524" text-anchor="middle">(Node.js, no dependency)</text><line x1="438" y1="110" x2="464" y2="110" stroke="#b4532a" stroke-width="2.5" marker-end="url(#a)"/><rect x="468" y="60" width="190" height="100" rx="12" fill="#fffaf0" stroke="#d9cdb4" stroke-width="1.5"/><text x="563" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#111524" text-anchor="middle">JSON plan</text><text x="563" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#111524" text-anchor="middle">same input,</text><text x="563" y="142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#111524" text-anchor="middle">same planId</text><line x1="660" y1="110" x2="686" y2="110" stroke="#b4532a" stroke-width="2.5" marker-end="url(#a)"/><rect x="690" y="60" width="190" height="100" rx="12" fill="#1b2135" stroke="#1b2135" stroke-width="1.5"/><text x="785" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e8c77a" text-anchor="middle">You</text><text x="785" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#f6efe0" text-anchor="middle">approve this exact</text><text x="785" y="142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#f6efe0" text-anchor="middle">plan, then it is applied</text>
</svg>
